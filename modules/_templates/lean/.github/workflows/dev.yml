name: Development

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.envrc'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Lean
      uses: leanprover/lean-action@v1

    - name: Build
      run: lake build

    - name: Run
      run: lake exe template
