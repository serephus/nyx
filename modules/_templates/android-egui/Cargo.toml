[package]
name = "template"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Android app template: Rust, egui and cargo-apk"
license = "GLWTPL"

[lib]
name = "template"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "template"
path = "src/main.rs"
doc = false

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
winit = { version = "0.30.12", default-features = false, features = [
  "android-native-activity",
  "rwh_06",
] }

# ---------------------------------------------------------------------------
# Android packaging (read by `cargo apk`)
# ---------------------------------------------------------------------------
[package.metadata.android]
package = "dev.serephus.template"
apk_name = "template"
# Add "armv7-linux-androideabi" here for 32-bit phones.
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Template"
theme = "@android:style/Theme.Material.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# Handle fold/unfold and density changes in place instead of letting Android
# restart the activity.
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|density|uiMode|fontScale"
resizeable_activity = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
panic = "abort"
