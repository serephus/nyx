name: Development

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.envrc'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v31

    - name: Typecheck
      run: nix develop --command idris2 --typecheck template.ipkg

    - name: Build
      run: nix develop --command idris2 --build template.ipkg

    - name: Run
      run: ./build/exec/template
