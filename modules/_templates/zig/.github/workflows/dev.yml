name: Development

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.envrc'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Format Check
      run: zig fmt --check build.zig src

    - name: Build
      run: zig build

    - name: Test
      run: zig build test

    - name: Run
      run: ./zig-out/bin/template
