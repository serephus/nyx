name: "Nix flake check"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    # Keep the name stable: it is a required status check in modules/nixit.nix.
    name: Nix flake check ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: actions/checkout@v7
      - run: nix flake metadata
      - run: nix flake check --keep-going
